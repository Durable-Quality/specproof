name: 🤖 CI

on:
  pull_request:
    branches: main
  merge_group:
  push:
    branches: main
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 🧰 Install dependencies
        run: bun install

      - name: 🏗️ Build
        run: bun run build

      - name: 📦 Build CLI
        run: bun run build:cli

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ✅ Verify published CLI runs under plain Node (no Bun)
        run: |
          node dist/scripts/cli.js --help
          node dist/scripts/cli.js generate --out /tmp/specproof-node-smoke.json
          test -s /tmp/specproof-node-smoke.json

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 🧰 Install dependencies
        run: bun install

      - name: 🧹 ESLint
        run: bun run lint:es

      - name: 🔎 Typecheck
        run: bun run lint:ts

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 🧰 Install dependencies
        run: bun install

      - name: 🧾 Run unit & contract tests
        run: bun run test:unit

  verify-e2e:
    name: Verify E2E (${{ matrix.pm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pm: [npm, pnpm, yarn, bun]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          # lts/*, not a pinned floor: this job's pnpm setup tracks
          # `version: latest`, and recent pnpm releases require newer Node
          # than the floor Next.js needs (pnpm 11.x requires Node >=22.13;
          # Node 20 makes it crash with ERR_UNKNOWN_BUILTIN_MODULE). The
          # `Build` job separately pins Node 20 as the deliberate minimum
          # compatibility check — that one's unaffected by this.
          node-version: lts/*

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📌 Setup pnpm
        if: matrix.pm == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: 🧶 Enable Corepack (Yarn Classic)
        if: matrix.pm == 'yarn'
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - name: 🧰 Install this repo's dependencies
        run: bun install

      - name: 📦 Build the CLI and pack the tarball
        run: |
          bun run build:cli
          npm pack --silent
          mv specproof-*.tgz /tmp/specproof.tgz

      - name: 🧪 Set up a consumer fixture repo
        run: |
          mkdir -p /tmp/consumer
          cp -R example/. /tmp/consumer/
          cd /tmp/consumer
          npm init -y >/dev/null

      - name: 📥 Install the packed tarball via ${{ matrix.pm }}
        # --ignore-scripts: this is only exercising `specproof generate`, which
        # touches no native dependencies, so transitive install/build scripts
        # (e.g. next's `sharp`) are irrelevant — and skipping them sidesteps
        # pnpm's ERR_PNPM_IGNORED_BUILDS hard failure on newer pnpm versions
        # for a script we don't need anyway.
        working-directory: /tmp/consumer
        run: |
          case "${{ matrix.pm }}" in
            npm)  npm install --ignore-scripts --no-audit --no-fund /tmp/specproof.tgz ;;
            pnpm) pnpm add --ignore-scripts /tmp/specproof.tgz ;;
            yarn) yarn add --ignore-scripts /tmp/specproof.tgz ;;
            bun)  bun add --ignore-scripts /tmp/specproof.tgz ;;
          esac

      - name: ✅ Run `specproof generate` via ${{ matrix.pm }}
        working-directory: /tmp/consumer
        run: |
          case "${{ matrix.pm }}" in
            npm)  npx --no-install specproof generate --out ./proof.json ;;
            pnpm) pnpm exec specproof generate --out ./proof.json ;;
            yarn) yarn specproof generate --out ./proof.json ;;
            bun)  bunx --no-install specproof generate --out ./proof.json ;;
          esac
          test -s ./proof.json
          node -e "const d=require('./proof.json'); if (!d.operationCount) { console.error('no operations found in proof.json'); process.exit(1); }"

      - name: ✅ `--check` passes on a freshly generated proof
        working-directory: /tmp/consumer
        run: |
          case "${{ matrix.pm }}" in
            npm)  npx --no-install specproof generate --out ./proof.json --check ;;
            pnpm) pnpm exec specproof generate --out ./proof.json --check ;;
            yarn) yarn specproof generate --out ./proof.json --check ;;
            bun)  bunx --no-install specproof generate --out ./proof.json --check ;;
          esac

      - name: 🧬 Introduce drift in the consumer's OpenAPI spec
        working-directory: /tmp/consumer
        run: |
          node -e "
            const fs = require('fs');
            const spec = JSON.parse(fs.readFileSync('./api/openapi.json', 'utf8'));
            spec.paths['/ci-drift-check'] = {
              get: {
                operationId: 'ciDriftCheckProbe',
                summary: 'Injected by CI to verify specproof generate --check catches drift',
                responses: { '200': { description: 'OK' } }
              }
            };
            fs.writeFileSync('./api/openapi.json', JSON.stringify(spec, null, 2) + '\n');
          "

      - name: 🚫 `--check` fails on a stale proof
        working-directory: /tmp/consumer
        run: |
          before=$(cat ./proof.json)

          set +e
          out=$(case "${{ matrix.pm }}" in
            npm)  npx --no-install specproof generate --out ./proof.json --check ;;
            pnpm) pnpm exec specproof generate --out ./proof.json --check ;;
            yarn) yarn specproof generate --out ./proof.json --check ;;
            bun)  bunx --no-install specproof generate --out ./proof.json --check ;;
          esac 2>&1)
          status=$?
          set -e
          echo "$out"

          if [ "$status" -ne 1 ]; then
            echo "::error::expected specproof generate --check to exit 1 on a stale proof, got $status"
            exit 1
          fi
          if ! grep -q "is stale relative to the spec/tests" <<< "$out"; then
            echo "::error::--check failed, but not with the expected staleness message"
            exit 1
          fi

          after=$(cat ./proof.json)
          if [ "$before" != "$after" ]; then
            echo "::error::--check must not modify ./proof.json — it only verifies, never writes"
            exit 1
          fi

      - name: 🩹 Regenerate the proof after drift
        working-directory: /tmp/consumer
        run: |
          before_count=$(node -e "console.log(require('./proof.json').operationCount)")

          case "${{ matrix.pm }}" in
            npm)  npx --no-install specproof generate --out ./proof.json ;;
            pnpm) pnpm exec specproof generate --out ./proof.json ;;
            yarn) yarn specproof generate --out ./proof.json ;;
            bun)  bunx --no-install specproof generate --out ./proof.json ;;
          esac

          after_count=$(node -e "console.log(require('./proof.json').operationCount)")
          expected=$((before_count + 1))
          if [ "$after_count" -ne "$expected" ]; then
            echo "::error::expected operationCount $expected after regenerating (got $after_count)"
            exit 1
          fi

      - name: ✅ `--check` passes again after regenerating
        working-directory: /tmp/consumer
        run: |
          case "${{ matrix.pm }}" in
            npm)  npx --no-install specproof generate --out ./proof.json --check ;;
            pnpm) pnpm exec specproof generate --out ./proof.json --check ;;
            yarn) yarn specproof generate --out ./proof.json --check ;;
            bun)  bunx --no-install specproof generate --out ./proof.json --check ;;
          esac

      - name: 🚫 `--check` hard-fails with no spec (plain generate soft-skips)
        working-directory: /tmp/consumer
        run: |
          mv ./api/openapi.json ./api/openapi.json.bak
          fail=0

          set +e
          out=$(case "${{ matrix.pm }}" in
            npm)  npx --no-install specproof generate --out ./proof-nospec.json ;;
            pnpm) pnpm exec specproof generate --out ./proof-nospec.json ;;
            yarn) yarn specproof generate --out ./proof-nospec.json ;;
            bun)  bunx --no-install specproof generate --out ./proof-nospec.json ;;
          esac 2>&1)
          status=$?
          set -e
          echo "$out"
          if [ "$status" -ne 0 ]; then
            echo "::error::plain generate should soft-skip (exit 0) with no spec, got $status"
            fail=1
          fi
          if ! grep -q "no OpenAPI spec found" <<< "$out"; then
            echo "::error::plain generate's no-spec warning is missing/changed"
            fail=1
          fi

          set +e
          out=$(case "${{ matrix.pm }}" in
            npm)  npx --no-install specproof generate --out ./proof.json --check ;;
            pnpm) pnpm exec specproof generate --out ./proof.json --check ;;
            yarn) yarn specproof generate --out ./proof.json --check ;;
            bun)  bunx --no-install specproof generate --out ./proof.json --check ;;
          esac 2>&1)
          status=$?
          set -e
          echo "$out"
          if [ "$status" -eq 0 ]; then
            echo "::error::--check should hard-fail (exit 1) with no spec, got 0"
            fail=1
          fi
          if ! grep -q "no OpenAPI spec found" <<< "$out"; then
            echo "::error::--check's no-spec failure message is missing/changed"
            fail=1
          fi

          mv ./api/openapi.json.bak ./api/openapi.json
          exit "$fail"
