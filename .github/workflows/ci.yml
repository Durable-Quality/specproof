name: 🤖 CI

on:
  pull_request:
    branches: main
  merge_group:
  push:
    branches: main
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 🧰 Install dependencies
        run: bun install

      - name: 🏗️ Build
        run: bun run build

      - name: 📦 Build CLI
        run: bun run build:cli

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ✅ Verify published CLI runs under plain Node (no Bun)
        run: |
          node dist/scripts/cli.js --help
          node dist/scripts/cli.js generate --out /tmp/specproof-node-smoke.json
          test -s /tmp/specproof-node-smoke.json

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 🧰 Install dependencies
        run: bun install

      - name: 🧹 ESLint
        run: bun run lint:es

      - name: 🔎 Typecheck
        run: bun run lint:ts

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 🧰 Install dependencies
        run: bun install

      - name: 🧾 Run unit & contract tests
        run: bun run test:unit
