name: 🤖 CI

on:
  pull_request:
    branches: main
  merge_group:
  push:
    branches: main
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 🧰 Install dependencies
        run: bun install

      - name: 🏗️ Build
        run: bun run build

      - name: 📦 Build CLI
        run: bun run build:cli

      - name: 🟢 Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: ✅ Verify published CLI runs under plain Node (no Bun)
        run: |
          node dist/scripts/cli.js --help
          node dist/scripts/cli.js generate --out /tmp/specproof-node-smoke.json
          test -s /tmp/specproof-node-smoke.json

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 🧰 Install dependencies
        run: bun install

      - name: 🧹 ESLint
        run: bun run lint:es

      - name: 🔎 Typecheck
        run: bun run lint:ts

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 🧰 Install dependencies
        run: bun install

      - name: 🧾 Run unit tests
        run: bun run test:unit

      - name: 🧾 Run integration tests
        run: bun run test:integration

  verify-e2e:
    name: Verify E2E (${{ matrix.pm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pm: [npm, pnpm, yarn, bun]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🟢 Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📌 Setup pnpm
        if: matrix.pm == 'pnpm'
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: 🧶 Enable Corepack (Yarn Classic)
        if: matrix.pm == 'yarn'
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - name: 🧰 Install this repo's dependencies
        run: bun install

      - name: 📦 Build the CLI and pack the tarball
        run: |
          bun run build:cli
          npm pack --silent
          mv specproof-*.tgz /tmp/specproof.tgz

      - name: 🧪 Set up a consumer fixture repo
        run: |
          mkdir -p /tmp/consumer
          cp -R example/. /tmp/consumer/
          cd /tmp/consumer
          npm init -y >/dev/null

      - name: 📥 Install the packed tarball via ${{ matrix.pm }}
        # --ignore-scripts: this is only exercising `specproof generate`, which
        # touches no native dependencies, so transitive install/build scripts
        # (e.g. next's `sharp`) are irrelevant — and skipping them sidesteps
        # pnpm's ERR_PNPM_IGNORED_BUILDS hard failure on newer pnpm versions
        # for a script we don't need anyway.
        working-directory: /tmp/consumer
        run: |
          case "${{ matrix.pm }}" in
            npm)  npm install --ignore-scripts --no-audit --no-fund /tmp/specproof.tgz ;;
            pnpm) pnpm add --ignore-scripts /tmp/specproof.tgz ;;
            yarn) yarn add --ignore-scripts /tmp/specproof.tgz ;;
            bun)  bun add --ignore-scripts /tmp/specproof.tgz ;;
          esac

      - name: ✅ Run `specproof generate` via ${{ matrix.pm }}
        working-directory: /tmp/consumer
        run: |
          case "${{ matrix.pm }}" in
            npm)  npx --no-install specproof generate --out ./proof.json ;;
            pnpm) pnpm exec specproof generate --out ./proof.json ;;
            yarn) yarn specproof generate --out ./proof.json ;;
            bun)  bunx --no-install specproof generate --out ./proof.json ;;
          esac
          test -s ./proof.json
          node -e "const d=require('./proof.json'); if (!d.operationCount) { console.error('no operations found in proof.json'); process.exit(1); }"

      - name: ✅ `--check` passes on a freshly generated proof
        working-directory: /tmp/consumer
        run: |
          case "${{ matrix.pm }}" in
            npm)  npx --no-install specproof generate --out ./proof.json --check ;;
            pnpm) pnpm exec specproof generate --out ./proof.json --check ;;
            yarn) yarn specproof generate --out ./proof.json --check ;;
            bun)  bunx --no-install specproof generate --out ./proof.json --check ;;
          esac

      - name: 🧬 Introduce drift in the consumer's OpenAPI spec
        working-directory: /tmp/consumer
        run: |
          node -e "
            const fs = require('fs');
            const spec = JSON.parse(fs.readFileSync('./api/openapi.json', 'utf8'));
            spec.paths['/ci-drift-check'] = {
              get: {
                operationId: 'ciDriftCheckProbe',
                summary: 'Injected by CI to verify specproof generate --check catches drift',
                responses: { '200': { description: 'OK' } }
              }
            };
            fs.writeFileSync('./api/openapi.json', JSON.stringify(spec, null, 2) + '\n');
          "

      - name: 🚫 `--check` fails on a stale proof
        working-directory: /tmp/consumer
        run: |
          before=$(cat ./proof.json)

          set +e
          out=$(case "${{ matrix.pm }}" in
            npm)  npx --no-install specproof generate --out ./proof.json --check ;;
            pnpm) pnpm exec specproof generate --out ./proof.json --check ;;
            yarn) yarn specproof generate --out ./proof.json --check ;;
            bun)  bunx --no-install specproof generate --out ./proof.json --check ;;
          esac 2>&1)
          status=$?
          set -e
          echo "$out"

          if [ "$status" -ne 1 ]; then
            echo "::error::expected specproof generate --check to exit 1 on a stale proof, got $status"
            exit 1
          fi
          if ! grep -q "is stale relative to the spec/tests" <<< "$out"; then
            echo "::error::--check failed, but not with the expected staleness message"
            exit 1
          fi

          after=$(cat ./proof.json)
          if [ "$before" != "$after" ]; then
            echo "::error::--check must not modify ./proof.json — it only verifies, never writes"
            exit 1
          fi

      - name: 🩹 Regenerate the proof after drift
        working-directory: /tmp/consumer
        run: |
          before_count=$(node -e "console.log(require('./proof.json').operationCount)")

          case "${{ matrix.pm }}" in
            npm)  npx --no-install specproof generate --out ./proof.json ;;
            pnpm) pnpm exec specproof generate --out ./proof.json ;;
            yarn) yarn specproof generate --out ./proof.json ;;
            bun)  bunx --no-install specproof generate --out ./proof.json ;;
          esac

          after_count=$(node -e "console.log(require('./proof.json').operationCount)")
          expected=$((before_count + 1))
          if [ "$after_count" -ne "$expected" ]; then
            echo "::error::expected operationCount $expected after regenerating (got $after_count)"
            exit 1
          fi

      - name: ✅ `--check` passes again after regenerating
        working-directory: /tmp/consumer
        run: |
          case "${{ matrix.pm }}" in
            npm)  npx --no-install specproof generate --out ./proof.json --check ;;
            pnpm) pnpm exec specproof generate --out ./proof.json --check ;;
            yarn) yarn specproof generate --out ./proof.json --check ;;
            bun)  bunx --no-install specproof generate --out ./proof.json --check ;;
          esac

      - name: "🚫 No spec: `--check` hard-fails, generate soft-skips, no stale proof shows"
        working-directory: /tmp/consumer
        run: |
          mv ./api/openapi.json ./api/openapi.json.bak
          fail=0

          set +e
          out=$(case "${{ matrix.pm }}" in
            npm)  npx --no-install specproof generate --out ./proof-nospec.json ;;
            pnpm) pnpm exec specproof generate --out ./proof-nospec.json ;;
            yarn) yarn specproof generate --out ./proof-nospec.json ;;
            bun)  bunx --no-install specproof generate --out ./proof-nospec.json ;;
          esac 2>&1)
          status=$?
          set -e
          echo "$out"
          if [ "$status" -ne 0 ]; then
            echo "::error::plain generate should soft-skip (exit 0) with no spec, got $status"
            fail=1
          fi
          if ! grep -q "no OpenAPI spec found" <<< "$out"; then
            echo "::error::plain generate's no-spec warning is missing/changed"
            fail=1
          fi

          set +e
          out=$(case "${{ matrix.pm }}" in
            npm)  npx --no-install specproof generate --out ./proof.json --check ;;
            pnpm) pnpm exec specproof generate --out ./proof.json --check ;;
            yarn) yarn specproof generate --out ./proof.json --check ;;
            bun)  bunx --no-install specproof generate --out ./proof.json --check ;;
          esac 2>&1)
          status=$?
          set -e
          echo "$out"
          if [ "$status" -eq 0 ]; then
            echo "::error::--check should hard-fail (exit 1) with no spec, got 0"
            fail=1
          fi
          if ! grep -q "no OpenAPI spec found" <<< "$out"; then
            echo "::error::--check's no-spec failure message is missing/changed"
            fail=1
          fi

          sp() {
            case "${{ matrix.pm }}" in
              npm)  npx --no-install specproof "$@" ;;
              pnpm) pnpm exec specproof "$@" ;;
              yarn) yarn specproof "$@" ;;
              bun)  bunx --no-install specproof "$@" ;;
            esac
          }

          # A committed proof with operations in it survives a run that finds no
          # spec: that is far more often a moved or renamed spec than an API
          # someone deleted.
          cp ./proof.json ./proof-lastrepo.json
          set +e
          out=$(sp generate --out ./proof-lastrepo.json 2>&1)
          status=$?
          set -e
          echo "$out"
          if [ "$status" -ne 0 ]; then
            echo "::error::keeping an existing proof should still exit 0, got $status"
            fail=1
          fi
          if ! cmp -s ./proof.json ./proof-lastrepo.json; then
            echo "::error::a proof with operations must survive a run that finds no spec"
            fail=1
          fi
          if ! grep -q "allow-empty" <<< "$out"; then
            echo "::error::the kept-proof warning should name the --allow-empty override"
            fail=1
          fi

          # But --allow-empty (which dev/build pass when refreshing the bundled
          # artifact) clears it, so pointing the viewer at a repo whose API is
          # not written yet cannot leave the last repo's coverage on screen
          # under this repo's name.
          sp generate --out ./proof-lastrepo.json --allow-empty || fail=1
          node -e "
            const p = require('./proof-lastrepo.json');
            if (p.operationCount !== 0 || p.hasSpec !== false) {
              console.error('--allow-empty must clear a proof carried over from another repo');
              process.exit(1);
            }
          " || fail=1
          rm ./proof-lastrepo.json

          mv ./api/openapi.json.bak ./api/openapi.json
          exit "$fail"

      - name: ✅ A barebones spec scaffolds instead of failing
        # The develop-alongside loop: start from `touch openapi.yaml` and add
        # operations as you go. Every step here has to stay renderable, because
        # a hard failure means `specproof dev` can never open on a repo whose
        # API is still being written.
        working-directory: /tmp/consumer
        run: |
          sp() {
            case "${{ matrix.pm }}" in
              npm)  npx --no-install specproof "$@" ;;
              pnpm) pnpm exec specproof "$@" ;;
              yarn) yarn specproof "$@" ;;
              bun)  bunx --no-install specproof "$@" ;;
            esac
          }

          mv ./api/openapi.json ./api/openapi.json.bak
          : > ./api/openapi.yaml

          sp generate --out ./proof-scaffold.json
          node -e "
            const p = require('./proof-scaffold.json');
            if (p.operationCount !== 0) { console.error('expected an empty proof'); process.exit(1); }
            if (p.hasSpec !== true) { console.error('a scaffold spec must record hasSpec'); process.exit(1); }
          "

          # A committed empty proof is a legitimate CI state, not perpetual drift.
          sp generate --out ./proof-scaffold.json --check

          # The first operation lands: --check catches it, regenerating heals it.
          cat > ./api/openapi.yaml <<'YAML'
          openapi: 3.0.0
          paths:
            /tasks:
              get:
                responses:
                  "200": { description: OK }
          YAML
          if sp generate --out ./proof-scaffold.json --check; then
            echo "::error::--check should fail once the scaffold gained an operation"
            exit 1
          fi
          sp generate --out ./proof-scaffold.json
          sp generate --out ./proof-scaffold.json --check

          # Emptying a spec that already had operations stays a hard failure:
          # that is truncation, not scaffolding.
          before=$(cat ./proof-scaffold.json)
          : > ./api/openapi.yaml
          if sp generate --out ./proof-scaffold.json; then
            echo "::error::emptying a spec whose proof has operations must fail"
            exit 1
          fi
          if [ "$before" != "$(cat ./proof-scaffold.json)" ]; then
            echo "::error::the refused run must not modify the proof"
            exit 1
          fi
          sp generate --out ./proof-scaffold.json --allow-empty

          rm ./api/openapi.yaml ./proof-scaffold.json
          mv ./api/openapi.json.bak ./api/openapi.json

      - name: ✅ A YAML spec audits identically to its JSON conversion
        # The format a spec is serialized in must be invisible to the proof:
        # a repo that stops converting openapi.yaml to JSON (or starts) should
        # see no diff and no --check failure. Converted here with a real YAML
        # writer, run from the checkout because that is where `yaml` is
        # installed; the consumer fixture only ever sees the .yaml file.
        run: |
          node -e "
            const fs = require('fs');
            const YAML = require('yaml');
            const spec = JSON.parse(fs.readFileSync('/tmp/consumer/api/openapi.json', 'utf8'));
            fs.writeFileSync('/tmp/consumer/api/openapi.yaml', YAML.stringify(spec));
          "

          cd /tmp/consumer

          # Both files present: discovery keeps auditing the JSON copy, and says so.
          out=$(case "${{ matrix.pm }}" in
            npm)  npx --no-install specproof generate --out ./proof-both.json ;;
            pnpm) pnpm exec specproof generate --out ./proof-both.json ;;
            yarn) yarn specproof generate --out ./proof-both.json ;;
            bun)  bunx --no-install specproof generate --out ./proof-both.json ;;
          esac 2>&1)
          echo "$out"
          if ! grep -q "specs sit at the same depth" <<< "$out"; then
            echo "::error::a YAML spec beside a JSON one must warn about the ambiguity"
            exit 1
          fi
          if ! cmp -s ./proof.json ./proof-both.json; then
            echo "::error::with both specs present, the JSON copy must win the tie"
            exit 1
          fi

          # YAML alone: byte-identical proof, and --check passes against the
          # proof the JSON spec produced.
          mv ./api/openapi.json ./api/openapi.json.bak
          case "${{ matrix.pm }}" in
            npm)  npx --no-install specproof generate --out ./proof-yaml.json ;;
            pnpm) pnpm exec specproof generate --out ./proof-yaml.json ;;
            yarn) yarn specproof generate --out ./proof-yaml.json ;;
            bun)  bunx --no-install specproof generate --out ./proof-yaml.json ;;
          esac
          if ! cmp -s ./proof.json ./proof-yaml.json; then
            echo "::error::the YAML spec produced a different proof than its JSON conversion"
            diff ./proof.json ./proof-yaml.json || true
            exit 1
          fi

          case "${{ matrix.pm }}" in
            npm)  npx --no-install specproof generate --out ./proof.json --check ;;
            pnpm) pnpm exec specproof generate --out ./proof.json --check ;;
            yarn) yarn specproof generate --out ./proof.json --check ;;
            bun)  bunx --no-install specproof generate --out ./proof.json --check ;;
          esac

          mv ./api/openapi.json.bak ./api/openapi.json
          rm ./api/openapi.yaml ./proof-both.json ./proof-yaml.json

      - name: ✅ `specproof dev` serves the audit view
        working-directory: /tmp/consumer
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          case "${{ matrix.pm }}" in
            npm)  npx --no-install specproof dev  > /tmp/dev.log 2>&1 & ;;
            pnpm) pnpm exec specproof dev         > /tmp/dev.log 2>&1 & ;;
            yarn) yarn specproof dev              > /tmp/dev.log 2>&1 & ;;
            bun)  bunx --no-install specproof dev > /tmp/dev.log 2>&1 & ;;
          esac

          if ! curl -sf --retry 30 --retry-delay 2 --retry-connrefused \
            http://localhost:3001/ -o /tmp/dev-response.html; then
            echo "::error::specproof dev never became reachable on :3001"
            cat /tmp/dev.log
            exit 1
          fi
          if ! grep -q "consumer" /tmp/dev-response.html; then
            echo "::error::dev server responded, but the rendered page doesn't contain the audited repo's name"
            cat /tmp/dev.log
            exit 1
          fi

          kill $(lsof -ti:3001) 2>/dev/null || true

      - name: ✅ `specproof build` compiles the app
        working-directory: /tmp/consumer
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          case "${{ matrix.pm }}" in
            npm)  timeout 180 npx --no-install specproof build ;;
            pnpm) timeout 180 pnpm exec specproof build ;;
            yarn) timeout 180 yarn specproof build ;;
            bun)  timeout 180 bunx --no-install specproof build ;;
          esac

          if [ ! -d node_modules/specproof/.next ]; then
            echo "::error::specproof build did not produce a .next output directory"
            exit 1
          fi

      - name: ✅ `specproof start` serves the production build
        working-directory: /tmp/consumer
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          case "${{ matrix.pm }}" in
            npm)  npx --no-install specproof start  > /tmp/start.log 2>&1 & ;;
            pnpm) pnpm exec specproof start         > /tmp/start.log 2>&1 & ;;
            yarn) yarn specproof start              > /tmp/start.log 2>&1 & ;;
            bun)  bunx --no-install specproof start > /tmp/start.log 2>&1 & ;;
          esac

          if ! curl -sf --retry 30 --retry-delay 2 --retry-connrefused \
            http://localhost:3001/ -o /tmp/start-response.html; then
            echo "::error::specproof start never became reachable on :3001"
            cat /tmp/start.log
            exit 1
          fi
          if ! grep -q "consumer" /tmp/start-response.html; then
            echo "::error::start server responded, but the rendered page doesn't contain the audited repo's name"
            cat /tmp/start.log
            exit 1
          fi

          kill $(lsof -ti:3001) 2>/dev/null || true
