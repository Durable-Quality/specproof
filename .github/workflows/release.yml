name: 🚢 Release

on:
  push:
    branches: main

permissions:
  contents: write # create git tag + GitHub Release
  id-token: write # npm provenance

jobs:
  publish:
    name: 🚀 Publish to npm
    runs-on: ubuntu-latest

    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 🧰 Install dependencies
        run: bun install

      - name: 🔎 Skip if this version is already on npm
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION is already published — nothing to do"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: ⚠️ Warn when NPM_TOKEN is missing
        if: steps.check.outputs.published == 'false' && env.NPM_TOKEN == ''
        run: echo "::warning::NPM_TOKEN secret is not set — skipping npm publish. Add it under Settings → Secrets and variables → Actions."

      - name: 🚀 Publish to npm
        if: steps.check.outputs.published == 'false' && env.NPM_TOKEN != ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 🏷️ Create GitHub Release
        if: steps.check.outputs.published == 'false' && env.NPM_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists — nothing to do"
            exit 0
          fi
          # Extract this version's section from CHANGELOG.md as the release notes.
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            const lines = fs.readFileSync("CHANGELOG.md", "utf8").split("\n");
            const start = lines.findIndex((l) => l.startsWith(`## [${v}]`));
            let notes = "";
            if (start !== -1) {
              let end = lines.findIndex((l, i) => i > start && l.startsWith("## ["));
              if (end === -1) end = lines.length;
              notes = lines.slice(start + 1, end).join("\n").trim();
            }
            fs.writeFileSync("RELEASE_NOTES.md", notes || `Release ${v}`);
          '
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file RELEASE_NOTES.md \
            --target "$GITHUB_SHA"
